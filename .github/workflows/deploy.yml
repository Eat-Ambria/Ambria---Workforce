# Build the app and publish it to the `gh-pages` branch.
#
# This used to go through actions/upload-pages-artifact + actions/deploy-pages,
# which hands the build to GitHub's Pages deployment API and waits for it to
# publish. That wait went from 8 seconds to minutes and then stopped completing
# at all: runs #144-#147 all died on "Timeout reached, aborting!" with a 0.47 MB
# artifact and a build that passed in 22 seconds every time. Worse, each timeout
# left its deployment holding the Pages lock, so the NEXT run failed instantly
# with "in progress deployment" until it was cancelled by hand.
#
# Branch-based publishing does not touch that API. The workflow pushes the built
# files to a branch and GitHub serves them. Same URL, no queue to wait in.
#
# ONE-TIME SETUP, required before this works:
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   Branch: gh-pages   Folder: / (root)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # to push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not `npm ci`): the lockfile is generated on Windows and
      # omits Linux-only optional binaries (esbuild, @emnapi/*), which makes the
      # strict `npm ci` fail on the Linux runner. `npm install` resolves them.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Set these in: GitHub repo -> Settings -> Secrets and variables -> Actions
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Web Push VAPID *public* key — required for the notifications toggle to
          # work in production. Safe to expose (it ships in the client bundle).
          # Prefer a secret/variable; falls back to this literal if unset.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || 'BMV038-UnoWkekRm7pIbko36dT0cuzlm1rbhz4tVj4FSYI_M1wtX_xVhfLlJi6y2NmMxyNdUWilmIXXFq2p22JE' }}

      # SPA fallback: GitHub Pages serves 404.html for unknown paths. Making it a
      # copy of index.html lets deep links (e.g. /fix-request) load the app so
      # React Router can handle the route instead of showing a 404.
      - run: cp dist/index.html dist/404.html

      # Without this, Pages runs the output through Jekyll, which silently drops
      # files and folders whose names begin with an underscore.
      - run: touch dist/.nojekyll

      - name: Push dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          # A fresh single-commit history every time, force-pushed. The branch is
          # build output, not source: keeping its history would grow the repo by
          # a full copy of the bundle on every deploy.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA} to gh-pages"
