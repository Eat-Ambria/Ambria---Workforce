name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NOT cancel-in-progress. Killing a run while actions/deploy-pages is waiting
  # on GitHub can leave that deployment pending, and the next run then waits on
  # the stuck one until it hits its own 10-minute timeout. Two pushes close
  # together is all it takes. GitHub's own starter workflow sets this to false
  # for the same reason; a queued deploy costs a minute, a wedged one costs ten.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # it takes ~20s; anything near this is a hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not `npm ci`): the lockfile is generated on Windows and
      # omits Linux-only optional binaries (esbuild, @emnapi/*), which makes the
      # strict `npm ci` fail on the Linux runner. `npm install` resolves them.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Set these in: GitHub repo -> Settings -> Secrets and variables -> Actions
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Web Push VAPID *public* key — required for the notifications toggle to
          # work in production. Safe to expose (it ships in the client bundle).
          # Prefer a secret/variable; falls back to this literal if unset.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || 'BMV038-UnoWkekRm7pIbko36dT0cuzlm1rbhz4tVj4FSYI_M1wtX_xVhfLlJi6y2NmMxyNdUWilmIXXFq2p22JE' }}
      # SPA fallback: GitHub Pages serves 404.html for unknown paths. Making it a
      # copy of index.html lets deep links (e.g. /fix-request) load the app so
      # React Router can handle the route instead of showing a 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # comfortably above the action own 15-minute wait below, so the action gets
    # to finish or report rather than being cut off mid-sentence by the runner
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Wait a long time on purpose. This step used to finish in under 20
          # seconds; the publish queue for this repo now runs at 4-6 minutes
          # (run #143 took 255s and succeeded, #146 was still going at 5m).
          # The artifact has been 0.47 MB throughout, so the delay is GitHub's.
          #
          # Failing fast is the wrong instinct here: when this step gives up, the
          # deployment it started keeps holding the Pages lock, and EVERY later
          # run then dies on "in progress deployment" until someone clears it by
          # hand. Waiting fifteen minutes costs wall-clock. Timing out costs a
          # wedge. So: wait.
          timeout: 900000
          # ride out a transient error rather than failing the whole run on one
          error_count: 10
